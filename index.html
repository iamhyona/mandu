const svgURL=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const TK=[1,3,4,2,5,6,7,8,10,'M']; // 단계: 빨강 하트 → 파랑 물방울 → 주황 별 → 하양 꽃 → 분홍 육각 → 초록 새싹 → 민트 → 보라 다이아 → 갈색 네모 → 교자만두
const TR=[13,17,22,28,35,43,52,61,71,86]; // 반지름
const TS=[1,3,6,10,15,21,28,36,45,55]; // 합쳐질 때 점수
const NAME=['하트','물방울','별','꽃','육각','새싹','민트','다이아','네모','교자만두'];
const IMG={};
for(let k=0;k<10;k++)for(const m of ['','b','o','x']){const im=new Image();im.src=svgURL(k===9?manduSVG(m):pieceSVG(TK[k],m));IMG[m+k]=im}

/* ===== 소리 ===== */
let ac,sound=true,master=null;
function silentWav(){const n=800,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,t)=>[...t].forEach((ch,i)=>v.setUint8(o+i,ch.charCodeAt(0)));w(0,"RIFF");v.setUint32(4,36+n,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,"data");v.setUint32(40,n,true);for(let i=0;i<n;i++)v.setUint8(44+i,128);return new Blob([b],{type:"audio/wav"})}
function unlock(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){} /* 아이폰 무음 스위치에도 소리 나게 */
 try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume();const bf=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=bf;s.connect(ac.destination);s.start(0)}catch(e){}
 if(!window._sa){try{const a=new Audio(URL.createObjectURL(silentWav()));a.loop=true;a.setAttribute('playsinline','');a.play().catch(()=>{});window._sa=a}catch(e){}}}
['pointerdown','touchend','keydown'].forEach(t=>addEventListener(t,()=>{if(!ac||ac.state!=='running')unlock()},{passive:true}));
function out(){if(!master||master.context!==ac){master=ac.createGain();master.connect(ac.destination)}master.gain.value=sound?1:0;return master}
function tone(type,f1,f2,dur,vol,delay){if(!ac||!sound)return;const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(out());o.start(t);o.stop(t+dur+.02)}
const sfx={
 drop:()=>tone('triangle',420,180,.12,.09),
 bump:v=>tone('sine',160+Math.random()*40,90,.08,Math.min(.06,v*.02)),
 merge:k=>{const f=330*Math.pow(1.122,k);tone('square',f,f*1.5,.09,.05);tone('triangle',f*2,f*3,.14,.06,.04)},
 mandu:()=>[523,659,784,1047,1319].forEach((f,i)=>tone('square',f,0,.16,.06,i*.08)),
 party:()=>{[784,988,1175,1568,1976].forEach((f,i)=>tone('square',f,0,.18,.06,i*.06));[392,494,587].forEach((f,i)=>tone('triangle',f,0,.5,.08,.3+i*.05))},
 warn:()=>tone('square',880,0,.06,.035),
 over:()=>[523,440,349,262].forEach((f,i)=>tone('triangle',f,f*.97,.35,.08,i*.28))};
/* 배경음: 말랑말랑 통통 튀는 원곡 (F장조, 느긋한 셔플) */
const BG={on:false,at:0,n:0};
const MEL='C5 . F5 . A5 . G5 F5|G5 . . E5 C5 . . .|D5 . F5 . A5 . C6 A5|G5 . . . . . . .|A5 . C6 . A5 . G5 F5|G5 . A5 G5 F5 . D5 .|E5 . G5 . F5 . E5 D5|F5 . . . . . . .'.split('|').map(b=>b.split(' '));
const BAS=['F2','C3','D2','C3','F2','A#2','C3','F2'];
const NN=n=>{const m=n.match(/([A-G])(#?)(\d)/);const s={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0);return 440*Math.pow(2,(s+(+m[3]+1)*12-69)/12)};
function bgmTick(){if(!BG.on||!ac||!sound)return;const sp=60/112/2;while(BG.at<ac.currentTime+.25){const bar=(BG.n>>3)%8,st=BG.n&7,sw=st%2?sp*.18:0,t=BG.at+sw;
  const n=MEL[bar][st];if(n&&n!=='.'){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=NN(n);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+sp*1.6);o.connect(g).connect(out());o.start(t);o.stop(t+sp*1.8)}
  if(st%2===0){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=NN(BAS[bar])*(st===4?1.5:1);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+sp*1.4);o.connect(g).connect(out());o.start(t);o.stop(t+sp*1.6)}
  if(st===2||st===6){const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=NN(BAS[bar])*4;g.gain.setValueAtTime(.012,t);g.gain.exponentialRampToValueAtTime(.0005,t+.08);o.connect(g).connect(out());o.start(t);o.stop(t+.1)}
  BG.at+=sp;BG.n++}}
function bgmStart(){if(!ac)return;BG.on=true;BG.at=ac.currentTime+.1;BG.n=0}
function bgmStop(){BG.on=false}
/* 진동: 안드로이드 vibrate, 아이폰 스위치 햅틱 */
const hapEl=(()=>{try{const l=document.createElement('label');l.style.cssText='position:fixed;left:-99px;top:0;width:1px;height:1px;overflow:hidden;opacity:0';const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');l.appendChild(i);document.body.appendChild(l);return l}catch(e){return null}})();
function buzz(p){try{if(navigator.vibrate){navigator.vibrate(p);return}if(hapEl)hapEl.click()}catch(e){}}

/* ===== 물리 (Matter.js) ===== */
const {Engine,Bodies,Composite,Body,Events}=Matter;
let engine=null,bodies=[],state='title',score=0,best=0,cur=0,nxt=0,aimX=W/2,dropT=0,lastDrop=null,FX=[],shake=0,warnT=0,overT=0,combo=0,comboT=0,maxTier=0,lastWin=null,tGame=0,mergeQ=[];
try{best=+localStorage.getItem('mandu-best')||0}catch(e){}
const pick=()=>Math.floor(Math.random()*Math.min(5,Math.max(3,maxTier)));
function newWorld(){engine=Engine.create();engine.gravity.y=1.15;engine.positionIterations=8;engine.velocityIterations=6;
 const o={isStatic:true,friction:.3,restitution:.1,label:'wall'},T=60;
 Composite.add(engine.world,[Bodies.rectangle(W/2,H+T/2,W+2*T,T,o),Bodies.rectangle(-T/2,H/2,T,H*3,o),Bodies.rectangle(W+T/2,H/2,T,H*3,o)]);
 bodies=[];mergeQ=[];
 Events.on(engine,'collisionStart',ev=>{for(const p of ev.pairs){const a=p.bodyA,b=p.bodyB;if(a.tier!=null&&a.tier===b.tier)mergeQ.push([a,b]);
   const v=Math.hypot(a.velocity.x-b.velocity.x,a.velocity.y-b.velocity.y);if(v>2.5)sfx.bump(v)}});
 Events.on(engine,'collisionActive',ev=>{for(const p of ev.pairs){const a=p.bodyA,b=p.bodyB;if(a.tier!=null&&a.tier===b.tier)mergeQ.push([a,b])}})}
function addPiece(k,px,py,vy){const r=TR[k],b=Bodies.circle(px,py,r,{restitution:.12,friction:.25,frictionStatic:.5,frictionAir:.004,density:.0012,label:'p'});
 b.tier=k;b.born=tGame;b.over=0;b.pop=tGame;b.blink=Math.random()*4;if(vy)Body.setVelocity(b,{x:0,y:vy});Composite.add(engine.world,b);bodies.push(b);return b}
function startGame(){score=0;maxTier=0;combo=0;FX=[];overT=0;warnT=0;tGame=0;newWorld();cur=pick();nxt=pick();aimX=W/2;dropT=0;lastDrop=null;state='play';
 ['ovTitle','ovOver','ovPause','ovRank'].forEach(hide);$('field').classList.remove('dead');hud();unlock();bgmStart();drawNext()}
function drop(){if(state!=='play'||dropT>0)return;const r=TR[cur];const px=Math.max(r+1,Math.min(W-r-1,aimX));lastDrop=addPiece(cur,px,TOP-r-6,2);sfx.drop();buzz(8);cur=nxt;nxt=pick();dropT=.5;drawNext()}
function doMerges(){if(!mergeQ.length)return;const done=new Set();
 for(const [a,b] of mergeQ){if(done.has(a)||done.has(b)||a.gone||b.gone)continue;done.add(a);done.add(b);a.gone=b.gone=1;Composite.remove(engine.world,[a,b]);bodies=bodies.filter(o=>o!==a&&o!==b);
  const k=a.tier,mx=(a.position.x+b.position.x)/2,my=(a.position.y+b.position.y)/2;
  combo=tGame-comboT<1.2?combo+1:1;comboT=tGame;const mul=Math.min(5,combo);
  if(k===9){ // 만두 + 만두 = 만두 파티!
   const pts=500*mul;score+=pts;burst(mx,my,'#ffd38a',60,true);FX.push({txt:'만두 파티! +'+pts,x:mx,y:my-20,l:1.8,c:'#ffd38a',big:1});sfx.party();buzz([40,40,80]);shake=.5;continue}
  const nk=k+1,nb=addPiece(nk,mx,my,-1.2);nb.pop=tGame;maxTier=Math.max(maxTier,nk);
  const pts=TS[nk]*mul;score+=pts;burst(mx,my,colorOf(nk),10+nk*3,nk>=7);
  FX.push({txt:'+'+pts+(mul>1?' x'+mul:''),x:mx,y:my-TR[nk]-6,l:1,c:mul>1?'#ffd23f':'#fff1dc'});
  if(nk===9){FX.push({txt:'교자만두 완성!',x:W/2,y:H*.35,l:1.8,c:'#ffd38a',big:1});sfx.mandu();buzz([30,30,60]);shake=.35}else{sfx.merge(nk);buzz(nk>=6?25:12)}}
 mergeQ=[];if(score>best){best=score;try{localStorage.setItem('mandu-best',best)}catch(e){}}hud()}
function colorOf(k){return k===9?'#f7e6c4':COL[TK[k]][0]}
function burst(px,py,col,n,big){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*(big?260:160);FX.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,l:.5+Math.random()*.5,c:Math.random()<.35?'#fff':col,s:big?4:3})}}
function checkOver(dt){let worst=0;for(const b of bodies){if(b===lastDrop&&tGame-b.born<1.2)continue;if(tGame-b.born<.8)continue;
  if(b.position.y-TR[b.tier]<TOP&&Math.abs(b.velocity.y)<1.5){b.over+=dt}else b.over=Math.max(0,b.over-dt*2);worst=Math.max(worst,b.over)}
 if(worst>.5){warnT+=dt;if(Math.floor(warnT*4)!==Math.floor((warnT-dt)*4))sfx.warn()}else warnT=0;
 if(worst>2.2)gameOver();return worst}
function gameOver(){if(state!=='play')return;state='over';bgmStop();sfx.over();buzz([60,40,100]);$('field').classList.add('dead');setTimeout(showOver,1200)}
function showOver(){$('overScore').textContent=score.toLocaleString();$('overTitle').textContent='GAME OVER';$('overInfo').textContent='최고 단계 · '+NAME[maxTier]+(score>=best&&score>0?' · NEW BEST!':'');
 lastWin={score,stage:maxTier+1,mode:'normal',saved:false};$('bSave').textContent='OK';$('bSave').disabled=false;$('nameIn').value=localStorage.getItem('mandu-name')||'';show('ovOver')}

/* ===== 그리기 ===== */
function resize(){const r=$('field').getBoundingClientRect();dpr=Math.min(3,devicePixelRatio||1);cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);SC=Math.min(cv.width/W,cv.height/H);OX=(cv.width-W*SC)/2;OY=(cv.height-H*SC);draw(0)}
addEventListener('resize',resize);if(window.visualViewport)visualViewport.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe($('field'));
function drawPiece(k,px,py,ang,mood,sc,alpha){const im=IMG[(mood||'')+k];if(!im||!im.complete)return;const s=TR[k]*2*44/32*(sc||1);x.save();x.translate(px,py);x.rotate(ang||0);if(alpha!=null)x.globalAlpha=alpha;x.drawImage(im,-s/2,-s/2,s,s);x.restore()}
function draw(dt){x.setTransform(1,0,0,1,0,0);x.fillStyle='#1a130e';x.fillRect(0,0,cv.width,cv.height);
 let sx=0,sy=0;if(shake>0){sx=(Math.random()*2-1)*5*shake;sy=(Math.random()*2-1)*5*shake}
 x.setTransform(SC,0,0,SC,OX+sx*SC,OY+sy*SC);
 // 찜기(대나무 바구니) 안쪽
 const top=-OY/SC;const g=x.createLinearGradient(0,top,0,H);g.addColorStop(0,'#241a12');g.addColorStop(1,'#3a2a1c');x.fillStyle=g;x.fillRect(0,top,W,H-top);
 x.strokeStyle='rgba(255,220,170,.05)';x.lineWidth=1;for(let yy=H-14;yy>top;yy-=14){x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}
 x.fillStyle='#8a6a45';x.fillRect(-4,top,4,H-top);x.fillRect(W,top,4,H-top);x.fillRect(-4,H,W+8,4);
 // 위험선
 const danger=state==='play'&&warnT>0;x.strokeStyle=danger&&Math.floor(tGame*6)%2?'#ff5a6e':'rgba(255,220,170,.28)';x.lineWidth=danger?2:1;x.setLineDash([6,5]);x.beginPath();x.moveTo(0,TOP);x.lineTo(W,TOP);x.stroke();x.setLineDash([]);
 // 떨어뜨릴 위치 안내 + 지금 팡팡이
 if(state==='play'){const r=TR[cur],px=Math.max(r+1,Math.min(W-r-1,aimX));x.strokeStyle='rgba(255,241,220,.22)';x.setLineDash([2,6]);x.beginPath();x.moveTo(px,TOP-r);x.lineTo(px,H);x.stroke();x.setLineDash([]);
  drawPiece(cur,px,TOP-r-6,0,'',1,dropT>0?.45:1)}
 // 팡팡이들
 const now=performance.now()/1000;
 for(const b of bodies){const k=b.tier,popS=Math.max(0,1-(tGame-b.pop)/.18);let mood='';
  if(b.over>.5)mood='x';else if((now+b.blink)%4<.14)mood='b';else if(b.speed>6)mood='o';
  drawPiece(k,b.position.x,b.position.y,b.angle,mood,1+popS*.25)}
 // 효과
 for(const f of FX){f.l-=dt;if(f.txt){f.y-=24*dt;x.globalAlpha=Math.max(0,Math.min(1,f.l*1.5));x.font=(f.big?'18px':'12px')+' Galmuri11, Silkscreen';x.textAlign='center';x.lineWidth=3;x.strokeStyle='#1a130e';x.strokeText(f.txt,f.x,f.y);x.fillStyle=f.c;x.fillText(f.txt,f.x,f.y);x.globalAlpha=1;continue}
  f.vy+=300*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.97;x.globalAlpha=Math.max(0,f.l*1.6);x.fillStyle=f.c;x.fillRect(f.x,f.y,f.s,f.s);x.globalAlpha=1}
 FX=FX.filter(f=>f.l>0);
 if(state==='play'&&warnT>.3){x.font='13px Galmuri11';x.textAlign='center';x.fillStyle='#ff8aa0';x.fillText('넘치기 직전이에요!',W/2,TOP-56)}}
function drawNext(){const c=$('nextC'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);const im=IMG[''+nxt];if(!im)return;const draw=()=>{g.clearRect(0,0,c.width,c.height);const s=24+nxt*6;g.drawImage(im,(c.width-s)/2,(c.height-s)/2,s,s)};if(im.complete)draw();else im.onload=draw}

/* ===== 조작: 손가락으로 위치 고르고, 떼면 떨어뜨리기 ===== */
const fld=$('field');let aiming=false;
const toX=e=>{const r=cv.getBoundingClientRect();return((e.clientX-r.left)*dpr-OX)/SC};
fld.addEventListener('pointerdown',e=>{if(state!=='play')return;aiming=true;aimX=toX(e);try{fld.setPointerCapture(e.pointerId)}catch(_){}});
fld.addEventListener('pointermove',e=>{if(state!=='play')return;if(aiming||e.pointerType==='mouse')aimX=toX(e)});
fld.addEventListener('pointerup',e=>{if(state!=='play'||!aiming)return;aiming=false;aimX=toX(e);drop()});
fld.addEventListener('pointercancel',()=>{aiming=false});
fld.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
const keys={};addEventListener('keydown',e=>{keys[e.key]=1;if(state==='play'&&(e.key===' '||e.key==='ArrowDown'||e.key==='Enter')){e.preventDefault();drop()}if(e.key==='Escape'||e.key==='p')togglePause()});addEventListener('keyup',e=>keys[e.key]=0);

/* ===== 루프 ===== */
let lastT=0,acc=0;
function loop(t){try{const dt=lastT?Math.min(.05,(t-lastT)/1000):0;lastT=t;
 if(state==='play'||state==='over'){const kx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);if(kx&&state==='play')aimX=Math.max(0,Math.min(W,aimX+kx*220*dt));
  if(state==='play'){tGame+=dt;dropT=Math.max(0,dropT-dt)}
  acc+=dt;let n=0;while(acc>=1/60&&n<4){Engine.update(engine,1000/60);doMerges();acc-=1/60;n++}if(n>=4)acc=0;
  if(state==='play')checkOver(dt)}
 shake=Math.max(0,shake-dt);bgmTick();draw(dt)}catch(err){try{console.error(err)}catch(e){}}requestAnimationFrame(loop)}

const PIX={pause:['........','.11..11.','.11..11.','.11..11.','.11..11.','.11..11.','.11..11.','........'],note:['....111.','....1111','....1..1','....1...','....1...','.1111...','11111...','.111....'],trophy:['.111111.','11111111','1.1111.1','.111111.','..1111..','...11...','..1111..','.111111.']};
function pixIcon(k){const m=PIX[k];let r='';m.forEach((row,y)=>[...row].forEach((v,xx)=>{if(v==='1')r+=`<rect x="${xx}" y="${y}" width="1.02" height="1.02"/>`}));return `<i class="pix"><svg viewBox="0 0 ${m[0].length} ${m.length}" shape-rendering="crispEdges" fill="currentColor">${r}</svg></i>`}
document.querySelectorAll('[data-ic]').forEach(el=>{el.outerHTML=pixIcon(el.dataset.ic).replace('<i class="pix"','<i class="pix" data-ic="'+el.dataset.ic+'"')});
function hud(){$('hScore').textContent=score.toLocaleString();const s=$('hScore'),p=s.parentElement;s.style.fontSize='14px';let f=14;while(s.scrollWidth>p.clientWidth-6&&f>8){f--;s.style.fontSize=f+'px'}}
function show(id){$(id).classList.add('show')}function hide(id){$(id).classList.remove('show')}
(function(){const sh=$('show');[0,2,4,6,9].forEach(k=>{const im=document.createElement('img');im.src=IMG[''+k].src;im.style.cssText='width:'+(k===9?44:30)+'px;height:auto';im.alt='';sh.appendChild(im)})})();
function togglePause(){if(state==='play'){state='pause';bgmStop();show('ovPause')}else if(state==='pause'){state='play';hide('ovPause');bgmStart();lastT=0}}
$('bPause').onclick=togglePause;$('bResume').onclick=togglePause;
$('bRestart').onclick=()=>{hide('ovPause');startGame()};
function toMenu(){['ovPause','ovOver','ovRank'].forEach(hide);$('field').classList.remove('dead');state='title';bgmStop();if(engine){Composite.clear(engine.world,false);bodies=[]}FX=[];show('ovTitle');hud()}
$('bMenu').onclick=toMenu;$('bMenu2').onclick=toMenu;
$('bSound').onclick=()=>{sound=!sound;$('bSound').classList.toggle('on',sound);if(ac&&master)master.gain.value=sound?1:0;if(sound&&state==='play')bgmStart()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});
const TUT={"goal":"같은 팡팡이 둘이 닿으면 합쳐져서 커져요!<br>끝까지 키우면 통통한 교자만두가 돼요.<br>점선 위로 넘치면 게임 끝!","touch":[["← 밀기 →","떨어뜨릴 곳 고르기"],["손 떼기","떨어뜨리기"]],"pc":[["마우스 / ← →","떨어뜨릴 곳 고르기"],["클릭 / SPACE","떨어뜨리기"]]};
$('bStart').onclick=()=>{unlock();phTut('mandu-tut',TUT,startGame)};
$('bRetry').onclick=()=>{hide('ovOver');startGame()};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));

/* ===== 랭킹 ===== */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function local(){try{return JSON.parse(localStorage.getItem('mandu-ranks')||'[]')}catch(e){return[]}}
$('bSave').onclick=async()=>{if(!lastWin||lastWin.saved)return;const n=($('nameIn').value.trim()||'익명').slice(0,8);localStorage.setItem('mandu-name',n);lastWin.saved=true;lastWin.n=n;$('bSave').textContent='…';$('bSave').disabled=true;
 const rec={n,s:lastWin.score,v:lastWin.stage,m:lastWin.mode};const l=local();l.push(rec);localStorage.setItem('mandu-ranks',JSON.stringify(l.slice(-300)));
 try{await fetch(`${RANK_URL}?g=mandu&a=add&n=${encodeURIComponent(n)}&s=${rec.s}&v=${rec.v}&m=${rec.m}`)}catch(e){}$('bSave').textContent='✓';openRank()};
async function openRank(){show('ovRank');render(null,true);try{const j=await fetch(`${RANK_URL}?g=mandu`).then(r=>r.json());render(j.top||[])}catch(e){render(local())}}
function render(rows,loading){if(loading){$('rankList').innerHTML='<span class="em">LOADING…</span>';return}rows=rows.slice().sort((a,b)=>b.s-a.s);const mw=lastWin&&lastWin.saved?lastWin:null;let marked=false;
 $('rankList').innerHTML=rows.length?rows.map((r,i)=>{let cls='';if(mw&&!marked&&r.n===mw.n&&+r.s===mw.score){cls='me';marked=true}const tier=Math.max(1,Math.min(10,+r.v||1));
  return `<div class="${cls}"><span class="r">${i+1}</span><span>${esc(r.n)}</span><span class="s">${r.s}</span><span class="m"><img src="${IMG[''+(tier-1)].src}" style="width:18px;height:18px;vertical-align:middle" alt=""></span></div>`}).join(''):'<span class="em">아직 기록이 없어요</span>'}
$('bRank').onclick=()=>{if(state==='play')togglePause();openRank()};$('bRank2').onclick=openRank;$('bRank3').onclick=openRank;

if(location.hash==='#test')window.__t={get state(){return state},get bodies(){return bodies},get score(){return score},get maxTier(){return maxTier},startGame,drop,setX:v=>aimX=v,addPiece:(k,px,py)=>addPiece(k,px,py,0)};
resize();hud();requestAnimationFrame(loop);
})();
</script>
